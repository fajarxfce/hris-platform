worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    access_log off;
    server_tokens off;
    client_max_body_size 8k;
    client_header_timeout 5s;
    client_body_timeout 2s;
    send_timeout 5s;
    keepalive_timeout 5s;
    reset_timedout_connection on;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    limit_conn_zone $binary_remote_addr zone=push_connections:1m;
    limit_req_zone $binary_remote_addr zone=push_requests:1m rate=20r/s;

    upstream hris_push_api {
        # Operator-owned file: exactly one reviewed "server address:port;" line.
        include /etc/nginx/hris-push-upstream.conf;
        keepalive 4;
    }

    server {
        listen 9443 ssl;
        server_name _;
        ssl_certificate /run/secrets/push-tls.crt;
        ssl_certificate_key /run/secrets/push-tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:push_tls:1m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # Explicit trusted Synapse network peers, followed by deny all.
        include /etc/nginx/hris-push-sources.conf;

        location = /_matrix/push/v1/notify {
            limit_except POST { deny all; }
            if ($args != "") { return 400; }
            limit_conn push_connections 4;
            limit_req zone=push_requests burst=16 nodelay;
            proxy_request_buffering on;
            proxy_buffering on;
            proxy_buffers 4 4k;
            proxy_busy_buffers_size 8k;
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 15s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host hris-push-api;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_pass http://hris_push_api;
        }

        location / { return 404; }
    }

    # Optional operator-managed listeners; empty by default. Never expose the private
    # callback on a public API listener. Include push-public-deny.nginx.conf there.
    include /etc/nginx/hris-push-listeners/*.conf;
}
