[versions]
tika = "4.1.0"
aws-sdk = "2.55.12"
commons-csv = "1.14.1"
commons-io = "2.22.0"
bouncycastle = "1.86"
kotlin = "2.3.21"
spring-boot = "4.1.1"
ktfmt = "0.59"
archunit = "1.4.1"
springdoc = "3.1.1"
swagger-parser = "2.1.48"

[libraries]
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika" }
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }
aws-apache5 = { module = "software.amazon.awssdk:apache5-client", version.ref = "aws-sdk" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
testcontainers-core = { module = "org.testcontainers:testcontainers" }
commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commons-csv" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
spring-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
angus-mail = { module = "org.eclipse.angus:angus-mail" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-spring = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
spring-boot-gradle = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
springdoc-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
swagger-parser = { module = "io.swagger.parser.v3:swagger-parser", version.ref = "swagger-parser" }
spring-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-client" }
spring-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-jackson = { module = "org.springframework.boot:spring-boot-starter-jackson" }
spring-jooq = { module = "org.springframework.boot:spring-boot-starter-jooq" }
spring-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-session = { module = "org.springframework.boot:spring-boot-starter-session-jdbc" }
spring-batch = { module = "org.springframework.boot:spring-boot-starter-batch" }
spring-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-core = { module = "org.springframework:spring-context" }
jackson-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
postgresql = { module = "org.postgresql:postgresql" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
jooq = { module = "org.jooq:jooq" }
jooq-codegen = { module = "org.jooq:jooq-codegen" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
ktfmt = { module = "com.facebook:ktfmt", version.ref = "ktfmt" }

bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
