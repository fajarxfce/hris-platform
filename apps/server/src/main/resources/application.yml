spring:
  application:
    name: hris-platform
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${HRIS_DATABASE_URL:jdbc:postgresql://localhost:5432/hris}
    username: ${HRIS_DATABASE_USER:hris_app}
    password: ${HRIS_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 16
      connection-timeout: 5000
  flyway:
    enabled: ${HRIS_MIGRATIONS_ENABLED:false}
    url: ${HRIS_DATABASE_URL:jdbc:postgresql://localhost:5432/hris}
    user: ${HRIS_MIGRATION_USER:hris_migrator}
    password: ${HRIS_MIGRATION_PASSWORD:}
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  tomcat:
    connection-timeout: 5s
    keep-alive-timeout: 15s
    max-connections: 1024
    accept-count: 100
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${HRIS_SECURE_COOKIES:true}
        same-site: lax
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.boot.jooq.autoconfigure.ExceptionTranslatorExecuteListener: "OFF"

springdoc:
  api-docs:
    enabled: ${HRIS_API_DOCS_ENABLED:false}
    path: /api/v1/openapi
    version: OPENAPI_3_1
  paths-to-match: /api/v1/**
  paths-to-exclude: /api/v1/openapi, /api/v1/openapi.yaml
  default-produces-media-type: application/json
  allowed-locales: en
  cache:
    max-entries: 1
  override-with-generic-response: false
  writer-with-order-by-keys: true
